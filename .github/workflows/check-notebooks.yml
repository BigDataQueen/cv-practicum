name: Проверка ноутбуков

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Библиотеки (как в Colab)
        run: |
          pip install --quiet torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet transformers numpy scipy scikit-learn scikit-image networkx matplotlib pandas \
            requests beautifulsoup4 pillow nbclient nbformat ipykernel cryptography
          python -m ipykernel install --user --name python3
          pip list 2>/dev/null | grep -iE '^(torch|torchvision|transformers|scikit-learn|scikit-image|networkx|numpy) '
      - name: Живой сайт новостей — подсказка-селекторы из ноутбука на страницах 1 и 2
        # сайт чужой и может временно не отвечать — тогда шаг жёлтый, но сломанный код пробы должен быть виден
        continue-on-error: true
        run: |
          python - <<'PY'
          import json, os
          nb = json.load(open('03_data_collection_labeling.ipynb'))
          cells = [''.join(c['source']) for c in nb['cells'] if c['cell_type'] == 'code']
          ns = {}
          offline = next(c for c in cells if 'def extract' in c)       # ячейку ищем по содержимому, не по номеру
          exec(offline.split('df = extract(HTML')[0], ns)               # parse_date, extract
          live = next(c for c in cells if 'def fetch' in c)
          exec(live.split('    try:')[0].split('try:')[0], ns)           # HEADERS, ru_bundle, fetch
          ns['item_selector'], ns['title_selector'], ns['date_selector'] = 'a.card', 'h5', 'span.badge'
          seen = []
          for u in ['https://mai.ru/press/news/', 'https://mai.ru/press/news/?PAGEN_1=2']:
              r = ns['fetch'](u)
              df = ns['extract'](r.text, u)
              print(u, 'код', r.status_code, '· новостей', len(df), '· без даты', int(df['дата'].isna().sum()))
              print(df.head(3).to_string())
              seen.append(set(df['ссылка']))
          print('страница 2 отличается от первой:', bool(seen[1] - seen[0]))
          PY
      - name: Выполнить все ноутбуки
        run: python .github/check_notebooks.py 0*.ipynb
      - name: Картинки выводов — в ветку ci-preview
        if: always()
        run: |
          python .github/extract_images.py executed preview
          cd preview
          git init -q -b ci-preview
          git add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m "Картинки выполненных ноутбуков ($GITHUB_SHA)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ci-preview
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: executed-notebooks
          path: executed/*.ipynb

  participants:
    # те же ноутбуки с номерами участников 1–8: у каждого своя выборка, и ни одна не должна падать
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        participant: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Библиотеки (как в Colab)
        run: |
          pip install --quiet torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet transformers numpy scipy scikit-learn scikit-image networkx matplotlib pandas \
            requests beautifulsoup4 pillow nbclient nbformat ipykernel
          python -m ipykernel install --user --name python3
      - name: Выполнить все ноутбуки с номером участника ${{ matrix.participant }}
        env:
          PARTICIPANT: ${{ matrix.participant }}
        run: python .github/check_notebooks.py 0*.ipynb
